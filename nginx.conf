# Internal static-file server for the frontend container.
# The separate top-level nginx Compose service handles public traffic and proxies APIs.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
